{% extends 'admin/master.html' %}
<!-- Title -->
{% block title %}销售统计{% endblock %}
<!-- block -->
{% block body %}
<div class="row">
    <div class="col-md-6">
        <h1>销售统计</h1>
    </div>
</div>
<div class="row">
    <div class="col-md-7">

        <div class="row">
            <div class="col-sm-4">
                <h2><small>今日销售总额：</small></h2>
            </div>
            <div class="col-sm-8">
                <h2>{{gross_sales}}</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-4">
                <h2><small>今日毛利润：</small></h2>
            </div>
            <div class="col-sm-8">
                <h2>{{profits}}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-5">
        <p><em>统计范围：今日 00:00 至现在，按 24 小时汇总。金额单位：人民币。</em></p>
    </div>
</div>
<hr>
<div class="row">
    <div class="col-md-12">
        <h2>今日销售额（按小时）</h2>
        <canvas id="summarySalesChart" width="300" height="100"></canvas>
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <h2>今日交易笔数（按小时）</h2>
        <canvas id="summaryCountChart" width="300" height="100"></canvas>
    </div>
</div>
<hr>
<div class="row">
    <div class="col-md-12">
        <p><a href="{{url_for('static', filename='data/sales.csv')}}">下载销售数据</a></p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.bundle.min.js"></script>
<script>
    var summaryChartData = JSON.parse('{{ summaryChartData|safe }}');
    console.log(summaryChartData)
</script>
<script src="{{ url_for('static', filename='js/summaryChart.js')}}" defer></script>
{% include 'layouts/footer.html' %} {% endblock %}
